<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Teacher / Education Book & AI Sparkle Graphics -->
  <g transform="translate(64, 70)">
    <!-- Book base -->
    <path d="M40 280 C 110 240, 180 260, 192 290 C 204 260, 274 240, 344 280 L 344 140 C 274 100, 204 120, 192 150 C 180 120, 110 100, 40 140 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M192 150 L 192 290" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
    <!-- Page lines -->
    <line x1="70" y1="160" x2="160" y2="140" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="195" x2="160" y2="175" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="230" x2="160" y2="210" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="140" x2="314" y2="160" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="175" x2="314" y2="195" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="224" y1="210" x2="314" y2="230" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    
    <!-- AI Sparkle 4-point star -->
    <path d="M192 30 Q 192 80 242 80 Q 192 80 192 130 Q 192 80 142 80 Q 192 80 192 30 Z" fill="url(#goldGrad)"/>
    <circle cx="90" cy="50" r="14" fill="#fbbf24"/>
    <circle cx="290" cy="60" r="10" fill="#60a5fa"/>
  </g>
</svg>
